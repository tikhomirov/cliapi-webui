version: '3.8'

services:
  cli-proxy-api:
    image: cli-proxy-api:local
    container_name: cli-proxy-api
    ports:
      - "127.0.0.1:8317:8317"
      - "127.0.0.1:1455:1455"
      - "127.0.0.1:8085:8085"
      - "127.0.0.1:11451:11451"
      - "127.0.0.1:51121:51121"
      - "127.0.0.1:54545:54545"
    environment:
      - NO_MANAGEMENT_AUTH=true
      - MANAGEMENT_PASSWORD=password
      - TZ=Asia/Shanghai
    volumes:
      - ./config.yaml:/CLIProxyAPI/config.yaml
      - ./auths:/root/.cli-proxy-api
      - ./logs:/CLIProxyAPI/logs
    restart: unless-stopped
    networks:
      - cliproxyapi

  cli-proxy-panel:
    image: cli-proxy-panel
    container_name: cli-proxy-panel
    ports:
      - "3001:80"
    environment:
      - CLI_PROXY_UPSTREAM=http://cli-proxy-api:8317
    restart: unless-stopped
    depends_on:
      - cli-proxy-api
    networks:
      - cliproxyapi

networks:
  cliproxyapi:
    driver: bridge
