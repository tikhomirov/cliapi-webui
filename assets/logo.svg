<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="hub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="fa" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="fb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="fc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="fd" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="out" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#818cf8" stroke-width="0.75">
    <line x1="0" y1="128" x2="512" y2="128"/><line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/><line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/><line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- Ambient glow -->
  <circle cx="256" cy="240" r="190" fill="#6366f1" opacity="0.04"/>

  <!-- Flow lines (input streams) -->
  <!-- Top-left: OpenAI -->
  <path d="M68 68 Q140 160 220 232" stroke="url(#fa)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M68 68 Q140 160 220 232" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.08" filter="url(#softglow)"/>

  <!-- Top-right: Claude -->
  <path d="M444 68 Q372 160 292 232" stroke="url(#fb)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M444 68 Q372 160 292 232" stroke="#f472b6" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.08" filter="url(#softglow)"/>

  <!-- Bottom-left: Gemini -->
  <path d="M68 400 Q140 320 220 268" stroke="url(#fc)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M68 400 Q140 320 220 268" stroke="#34d399" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.08" filter="url(#softglow)"/>

  <!-- Bottom-right: Codex -->
  <path d="M444 400 Q372 320 292 268" stroke="url(#fd)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M444 400 Q372 320 292 268" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.08" filter="url(#softglow)"/>

  <!-- Provider nodes -->
  <!-- OpenAI -->
  <circle cx="68" cy="68" r="22" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
  <text x="68" y="74" text-anchor="middle" fill="#22d3ee" font-family="'SF Pro Display',system-ui,sans-serif" font-size="16" font-weight="700">O</text>

  <!-- Claude -->
  <circle cx="444" cy="68" r="22" fill="#0f172a" stroke="#f472b6" stroke-width="2"/>
  <text x="444" y="74" text-anchor="middle" fill="#f472b6" font-family="'SF Pro Display',system-ui,sans-serif" font-size="16" font-weight="700">C</text>

  <!-- Gemini -->
  <circle cx="68" cy="400" r="22" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
  <text x="68" y="406" text-anchor="middle" fill="#34d399" font-family="'SF Pro Display',system-ui,sans-serif" font-size="16" font-weight="700">G</text>

  <!-- Codex -->
  <circle cx="444" cy="400" r="22" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <text x="444" y="406" text-anchor="middle" fill="#fbbf24" font-family="'SF Pro Display',system-ui,sans-serif" font-size="16" font-weight="700">X</text>

  <!-- Central hub — hexagon -->
  <polygon points="256,192 312,224 312,272 256,304 200,272 200,224" fill="url(#hub)" filter="url(#glow)"/>

  <!-- Inner diamond — routing symbol -->
  <polygon points="256,210 276,248 256,286 236,248" fill="#0f172a" opacity="0.45"/>
  <polygon points="256,220 269,248 256,276 243,248" fill="#818cf8" opacity="0.6"/>

  <!-- Core dot -->
  <circle cx="256" cy="248" r="7" fill="#e0e7ff"/>
  <circle cx="256" cy="248" r="4" fill="#c7d2fe"/>

  <!-- Outer ring with orbital dots -->
  <circle cx="256" cy="248" r="66" fill="none" stroke="#818cf8" stroke-width="1.2" opacity="0.2" stroke-dasharray="6 10">
    <animateTransform attributeName="transform" type="rotate" from="0 256 248" to="360 256 248" dur="40s" repeatCount="indefinite"/>
  </circle>
  <circle cx="256" cy="248" r="66" fill="none" stroke="#6366f1" stroke-width="0.8" opacity="0.12"/>
  <!-- Orbital dots -->
  <circle cx="322" cy="248" r="3" fill="#a5b4fc" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="0 256 248" to="360 256 248" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="256" cy="314" r="3" fill="#a5b4fc" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="120 256 248" to="480 256 248" dur="18s" repeatCount="indefinite"/>
  </circle>

  <!-- Output arrow -->
  <path d="M256 304 L256 356" stroke="url(#out)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M240 340 L256 368 L272 340" stroke="url(#out)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- API label -->
  <text x="256" y="400" text-anchor="middle" fill="#67e8f9" font-family="'JetBrains Mono','Fira Code',monospace" font-size="18" font-weight="700" letter-spacing="6" opacity="0.9">API</text>

  <!-- Brand -->
  <text x="256" y="458" text-anchor="middle" fill="#f1f5f9" font-family="'Inter',system-ui,sans-serif" font-size="32" font-weight="800" letter-spacing="1">CLI Proxy</text>
  <text x="256" y="484" text-anchor="middle" fill="#475569" font-family="'Inter',system-ui,sans-serif" font-size="12" font-weight="500" letter-spacing="4" opacity="0.7">MANAGEMENT</text>
</svg>